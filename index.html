<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown 😉</title>
    <style>
        body { 
            background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; 
        }
        h1 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
        .timer { display: flex; gap: 30px; }
        .unit { text-align: center; }
        .number { display: block; font-size: 4rem; font-weight: bold; min-width: 100px; }
        .label { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; }
        .expired { font-size: 2rem; color: #ef4444; display: none; }
    </style>
</head>
<body>

    <h1>Days Till I see you ❤️</h1>
    
    <div class="timer" id="timer">
        <div class="unit"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </div>
    <div id="message" class="expired">The day has arrived!</div>

    <script>
        // Set target to April 29 of the current year (2026)
        const targetDate = new Date("April 29, 2026 00:00:00").getTime();

        const interval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Time calculations
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result
            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');

            // If the countdown is finished
            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("timer").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
